<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="RepoGuide: AI copilot that guides developers to their first open-source contribution.">
<defs>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#69f0ae"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="aura" cx="720" cy="70" r="300" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#00e676" stop-opacity=".25"/><stop offset="1" stop-color="#00e676" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="860" height="220" rx="16" fill="#0d1117"/>
<rect width="860" height="220" rx="16" fill="url(#aura)"/>
<rect x="1" y="1" width="858" height="218" rx="15" fill="none" stroke="#00e676" stroke-opacity=".28"/>
<rect x="1" y="1" width="858" height="218" rx="15" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="160 1992" filter="url(#glow)">
<animate attributeName="stroke-dashoffset" values="0;-2152" dur="7s" repeatCount="indefinite"/>
</rect>

<!-- Right Side Illustration: AI Git Graph / Orbiting Core -->
<g transform="translate(730,110)">
<ellipse rx="74" ry="22" fill="none" stroke="#00e676" stroke-opacity=".3" transform="rotate(-20)"/>
<ellipse rx="74" ry="22" fill="none" stroke="#00e676" stroke-opacity=".18" transform="rotate(40)"/>
<circle r="4.5" fill="#fff" filter="url(#glow)" transform="rotate(-20)">
<animateMotion dur="5.5s" repeatCount="indefinite" path="M -74,0 A 74 22 0 0 1 74,0 A 74 22 0 0 1 -74,0"/>
</circle>
<circle r="3.5" fill="#69f0ae" filter="url(#glow)" transform="rotate(40)">
<animateMotion dur="7s" repeatCount="indefinite" path="M 74,0 A 74 22 0 0 1 -74,0 A 74 22 0 0 1 74,0"/>
</circle>

<!-- 3D Rotating Polyhedron Core -->
<g filter="url(#glow)">
<animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
<polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#00e676" fill-opacity=".12" stroke="#00e676" stroke-width="1.6"/>
<line x1="0" y1="-36" x2="0" y2="36" stroke="#00e676" stroke-width="1.2" stroke-opacity=".6"/>
<line x1="-31" y1="-18" x2="31" y2="18" stroke="#00e676" stroke-width="1.2" stroke-opacity=".6"/>
<line x1="-31" y1="18" x2="31" y2="-18" stroke="#00e676" stroke-width="1.2" stroke-opacity=".6"/>
<circle cx="0" cy="0" r="10" fill="#00e676" fill-opacity=".35">
<animate attributeName="r" values="8;13;8" dur="3s" repeatCount="indefinite"/>
<animate attributeName="fill-opacity" values=".2;.5;.2" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="0" cy="0" r="4" fill="#ffffff"/>
</g>

<!-- Git branch node indicators -->
<line x1="-80" y1="60" x2="-35" y2="25" stroke="#00e676" stroke-opacity=".4" stroke-dasharray="3 3"/>
<circle cx="-80" cy="60" r="3" fill="#00e676" stroke="#0d1117" stroke-width="1"/>
<line x1="80" y1="-50" x2="35" y2="-20" stroke="#00e676" stroke-opacity=".4" stroke-dasharray="3 3"/>
<circle cx="80" cy="-50" r="3" fill="#69f0ae" stroke="#0d1117" stroke-width="1"/>
</g>

<!-- Status Badge -->
<rect x="28" y="24" width="144" height="22" rx="11" fill="#00e676" fill-opacity=".10" stroke="#00e676" stroke-opacity=".55"/>
<circle cx="41" cy="35" r="3.5" fill="#00e676">
<animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="52" y="39" font-family="Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#00e676" letter-spacing="1">FLAGSHIP PROJECT</text>

<!-- Title -->
<text x="30.4" y="80.4" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#002c14">RepoGuide</text>
<text x="29.6" y="79.6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#00341c">RepoGuide</text>
<text x="28.8" y="78.8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#003c24">RepoGuide</text>
<text x="28" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#t)">RepoGuide</text>

<!-- Subtitle -->
<text x="28" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#c9d1d9">AI copilot that guides developers to their first open source contribution.</text>
<text x="28" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8b949e">Repository architecture analysis, issue recommendation &amp; step-by-step PR guidance.</text>

<!-- Tech Tags -->
<rect x="28" y="146" width="94" height="24" rx="12" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-opacity=".45"/>
<text x="75" y="162" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#00e676">AI Agents</text>

<rect x="130" y="146" width="94" height="24" rx="12" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-opacity=".45"/>
<text x="177" y="162" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#00e676">TypeScript</text>

<rect x="232" y="146" width="76" height="24" rx="12" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-opacity=".45"/>
<text x="270" y="162" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#00e676">Next.js</text>

<rect x="316" y="146" width="84" height="24" rx="12" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-opacity=".45"/>
<text x="358" y="162" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#00e676">LangChain</text>

<rect x="408" y="146" width="96" height="24" rx="12" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-opacity=".45"/>
<text x="456" y="162" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#00e676">GitHub API</text>

<!-- Repository Link CTA -->
<text x="28" y="198" font-family="Consolas,Menlo,monospace" font-size="13" fill="#00e676">view repository</text>
<text x="150" y="198" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#00e676" opacity=".2">&gt;<animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.0s" repeatCount="indefinite"/></text>
<text x="160" y="198" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#00e676" opacity=".2">&gt;<animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></text>
<text x="170" y="198" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#00e676" opacity=".2">&gt;<animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></text>
</svg>
